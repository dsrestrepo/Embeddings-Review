[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "npj-embeddings-review"
version = "0.1.0"
description = "Reproducible preprocessing and plotting for a clinical embeddings literature review"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
  "seaborn>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
review = "npj_embeddings_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
